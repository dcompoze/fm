[package]
default-run = "fm"
edition = "2021"
name = "fm"
version = "1.0.0"

[[bin]]
name = "fm"
path = "src/main.rs"

[[bin]]
name = "fm-server"
path = "server/main.rs"

[[bin]]
name = "fm-client"
path = "client/main.rs"

[profile]
dev = { opt-level = 0, debug = true }
release = { opt-level = 3, debug = false }

[dependencies]
anyhow = "1.0.104"
byteorder = "1.5.0"
bytes = "1.12.1"
clap = { version = "4.6.7" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
env_logger = "0.11.11"
fs4 = { version = "1.1.0" }
futures = "0.3.34"
git2 = "0.21.0"
log = "0.4.35"
prost = "0.14.5"
prost-types = "0.14.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
unicode-width = "0.2.3"
walkdir = "2.5.0"
whoami = "2.1.3"

[build-dependencies]
prost-build = "0.14.5"
